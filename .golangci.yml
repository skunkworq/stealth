# Release lint profile.
# The previous broad ruleset is preserved in .golangci.strict.yml for backlog cleanup.
version: "2"

run:
  timeout: 10m
  concurrency: 4
  issues-exit-code: 1
  tests: true
  build-tags:
    - integration
  skip-dirs:
    - "docs/"
    - ".venv/"
    - "node_modules/"
    - "lab-ui/"
  skip-files:
    - '.*_test\.go'
    - 'mock_.*\.go'
    - 'generated.*\.go'

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  default: none
  enable:
    - govet
    - ineffassign

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/skunkworq/stealth)
      custom-order: true

    gofumpt:
      extra-rules: true

  exclusions:
    generated: lax
    paths:
      - "docs/"
      - ".venv/"
      - "node_modules/"
      - "lab-ui/"
