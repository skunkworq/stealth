name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

# Shared preconditions for every Go job:
#   1. The `brws/lab/static/` tree is generated from `lab-ui/` (Next.js) and
#      is gitignored. Every job that compiles code importing brws/lab must
#      run `make lab-ui` first, otherwise the `//go:embed static/*` directive
#      in brws/lab/enhanced_server.go fails with "pattern static/*: no
#      matching files found".
#   2. Node.js 20 is required to run `next build`.

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, cuttlefish]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Cache disabled on self-hosted: the post-job cache save uploads
          # the entire Go module/build cache and hangs for hours on the
          # cuttlefish runners (or exhausts disk writing cache.tzst).
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: "npm" disabled on self-hosted (1.7GB cache download blows job timeout)
          cache-dependency-path: lab-ui/package-lock.json

      - name: Install lab-ui dependencies
        run: cd lab-ui && npm ci
      - name: Build lab-ui static assets
        run: make lab-ui
      - name: Build Rust libraries (stealth_sniffer, tlsfprint)
        run: |
          # Use absolute path so the step works even when the runner PATH
          # doesn't have cargo (self-hosted runners that haven't been
          # recycled since cargo was added to .path).
          export PATH="$HOME/.cargo/bin:$PATH"
          cd brws/sniffer/rust && cargo build --release
          cd ../../tlsfprint/rust && cargo build --release

      # Install golangci-lint from source so it is built against the same
      # go toolchain as the module under test. The published binaries from
      # golangci/golangci-lint-action@v6 lag behind newer Go releases and
      # fail with "Go language version (goX) used to build golangci-lint
      # is lower than the targeted Go version" when the module's go.mod
      # advances ahead of the action's release cadence.
      - name: Install golangci-lint from source
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: go vet
        run: go vet ./...

  build:
    name: Build
    runs-on: [self-hosted, cuttlefish]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Cache disabled on self-hosted: the post-job cache save uploads
          # the entire Go module/build cache and hangs for hours on the
          # cuttlefish runners (or exhausts disk writing cache.tzst).
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: "npm" disabled on self-hosted (1.7GB cache download blows job timeout)
          cache-dependency-path: lab-ui/package-lock.json

      - name: Install lab-ui dependencies
        run: cd lab-ui && npm ci
      - name: Build lab-ui static assets
        run: make lab-ui
      - name: Build Rust libraries (stealth_sniffer, tlsfprint)
        run: |
          # Use absolute path so the step works even when the runner PATH
          # doesn't have cargo (self-hosted runners that haven't been
          # recycled since cargo was added to .path).
          export PATH="$HOME/.cargo/bin:$PATH"
          cd brws/sniffer/rust && cargo build --release
          cd ../../tlsfprint/rust && cargo build --release

      - name: Build all packages
        run: go build ./...

      - name: Build CLI binaries
        run: |
          go build -o build/brwslab ./cmd/brwslab
          go build -o build/stealth ./cmd/stealth
          go build -o build/labd ./cmd/labd
          go build -o build/semantic ./cmd/semantic
          go build -o build/stealth-mcp ./cmd/stealth-mcp
          go build -o build/semantic-mcp ./cmd/semantic-mcp

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/
          retention-days: 7

  test:
    name: Test
    runs-on: [self-hosted, cuttlefish]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Cache disabled on self-hosted: the post-job cache save uploads
          # the entire Go module/build cache and hangs for hours on the
          # cuttlefish runners (or exhausts disk writing cache.tzst).
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: "npm" disabled on self-hosted (1.7GB cache download blows job timeout)
          cache-dependency-path: lab-ui/package-lock.json

      - name: Install lab-ui dependencies
        run: cd lab-ui && npm ci
      - name: Build lab-ui static assets
        run: make lab-ui
      - name: Build Rust libraries (stealth_sniffer, tlsfprint)
        run: |
          # Use absolute path so the step works even when the runner PATH
          # doesn't have cargo (self-hosted runners that haven't been
          # recycled since cargo was added to .path).
          export PATH="$HOME/.cargo/bin:$PATH"
          cd brws/sniffer/rust && cargo build --release
          cd ../../tlsfprint/rust && cargo build --release

      - name: Run tests
        run: go test -count=1 -timeout 180s ./...

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout 180s -short ./...

  test-coverage:
    name: Coverage
    runs-on: [self-hosted, cuttlefish]
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Cache disabled on self-hosted: the post-job cache save uploads
          # the entire Go module/build cache and hangs for hours on the
          # cuttlefish runners (or exhausts disk writing cache.tzst).
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: "npm" disabled on self-hosted (1.7GB cache download blows job timeout)
          cache-dependency-path: lab-ui/package-lock.json

      - name: Install lab-ui dependencies
        run: cd lab-ui && npm ci
      - name: Build lab-ui static assets
        run: make lab-ui
      - name: Build Rust libraries (stealth_sniffer, tlsfprint)
        run: |
          # Use absolute path so the step works even when the runner PATH
          # doesn't have cargo (self-hosted runners that haven't been
          # recycled since cargo was added to .path).
          export PATH="$HOME/.cargo/bin:$PATH"
          cd brws/sniffer/rust && cargo build --release
          cd ../../tlsfprint/rust && cargo build --release

      - name: Generate coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -timeout 180s ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 30
